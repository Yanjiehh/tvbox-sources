# 作用：把 360.json 和 live/ 直播清单同步到腾讯云 COS（电视读取的那份）
# 约定：仓库里可继续用 raw.githubusercontent.com / gh-proxy 地址引用 live/ 文件，
#       本工作流上传前会把它们自动改写为 COS 地址（键名 = sha256(路径)[:32]+后缀，无特征）
# 上传各步骤带独立重试（4次指数退避），抵御 Runner↔COS 的瞬时网络抖动
name: sync-360-to-cos

on:
  push:
    paths:
      - "360.json"
      - "live/**"
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * *"        # UTC 20:00 = 北京时间 04:00

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync config + live lists to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          python -m pip install -q cos-python-sdk-v5
          python - <<'PYEOF'
          import os, glob, hashlib, re, json, time
          from qcloud_cos import CosConfig, CosS3Client

          BUCKET = "9cfef94647d443a1-1254999378"
          REGION = "ap-guangzhou"
          BASE = "https://" + BUCKET + ".cos." + REGION + ".myqcloud.com"
          CFG_KEY = "b26e80a8d9924ce79147ff3cac4d0765.json"

          def cos_key(rel):
              ext = os.path.splitext(rel)[1]
              return hashlib.sha256(rel.encode("utf-8")).hexdigest()[:32] + ext

          cfg = CosConfig(
              Region=REGION,
              SecretId=os.environ["COS_SECRET_ID"],
              SecretKey=os.environ["COS_SECRET_KEY"],
              Scheme="https",
          )
          client = CosS3Client(cfg)

          def retry(fn, name, attempts=4):
              delay = 5
              for i in range(attempts):
                  try:
                      fn()
                      return
                  except Exception as e:
                      print(name, "attempt", i + 1, "failed:", str(e)[:200])
                      if i == attempts - 1:
                          raise
                      time.sleep(delay)
                      delay *= 2

          # 1) upload live lists to COS (each retried independently)
          for path in sorted(glob.glob("live/*.txt")):
              with open(path, "rb") as f:
                  body = f.read()
              key = cos_key(path)

              def do_live(b=body, k=key):
                  client.put_object(Bucket=BUCKET, Key=k, Body=b, ContentType="text/plain; charset=utf-8")
                  client.put_object_acl(Bucket=BUCKET, Key=k, ACL="public-read")

              retry(do_live, "live " + path)
              print("live synced:", path, "->", key)

          # 2) rewrite raw github refs for live/ to COS urls (whole URL incl proxy prefix)
          with open("360.json", "rb") as f:
              cfg_text = f.read().decode("utf-8")

          def repl(m):
              rel = m.group(1)
              if rel.startswith("live/"):
                  return BASE + "/" + cos_key(rel)
              return m.group(0)

          cfg_text2 = re.sub(
              r"https://[^\s\"'<>]*raw\.githubusercontent\.com/Yanjiehh/tvbox-sources/main/(live/[^\s\"'<>]+)",
              repl,
              cfg_text,
          )
          json.loads(cfg_text2)
          leftover = [u for u in re.findall(r"https?://[^\s\"'<>]+", cfg_text2) if "githubusercontent" in u]
          if leftover:
              raise SystemExit("raw github refs remain: " + str(leftover))
          if "gh-proxy.com/https://" + BUCKET in cfg_text2:
              raise SystemExit("mangled proxy-wrapped cos url detected")
          print("config rewritten: live refs now point to COS")

          # 3) upload rewritten config (retried)
          data = cfg_text2.encode("utf-8")

          def do_cfg():
              client.put_object(Bucket=BUCKET, Key=CFG_KEY, Body=data, ContentType="application/json; charset=utf-8")
              client.put_object_acl(Bucket=BUCKET, Key=CFG_KEY, ACL="public-read")

          retry(do_cfg, "config")
          print("config synced", len(data), "bytes ->", CFG_KEY)
          PYEOF
